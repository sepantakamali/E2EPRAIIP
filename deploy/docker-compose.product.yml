name: textclf-product

services:
  textclf-api:
    image: ghcr.io/sepantakamali/e2epraiip:${IMAGE_TAG:-latest}
    container_name: textclf-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MODEL_POINTER: ${MODEL_POINTER:-stable}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TO_FILE: ${LOG_TO_FILE:-1}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PREDICT: ${RATE_LIMIT_PREDICT:-60/minute}
      SHOW_DOCS: ${SHOW_DOCS:-0}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_TOKENS_FILE: /run/secrets/textclf_tokens
      INTERNAL_ONLY_ENABLED: ${INTERNAL_ONLY_ENABLED:-1}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
    volumes:
      - ../artifacts:/app/artifacts:ro
      - ../logs:/app/logs
    secrets:
      - textclf_tokens
    expose:
      - "8000"
    networks:
      - app
      - observability
    command: >
      uvicorn textclf.api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ui:
    image: ghcr.io/sepantakamali/e2epraiip:${IMAGE_TAG:-latest}
    container_name: textclf-ui
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      API_BASE_URL: http://textclf-api:8000
      API_BEARER_TOKEN_FILE: /run/secrets/ui_api_token
    secrets:
      - ui_api_token
    expose:
      - "8501"
    networks:
      - app
    command: >
      streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      textclf-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  metrics-proxy:
    image: nginx:1.27-alpine
    container_name: metrics-proxy
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ../nginx/metrics.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - metrics_htpasswd
    networks:
      - observability
    depends_on:
      textclf-api:
        condition: service_healthy

web-proxy:
  image: nginx:1.27-alpine
  container_name: textclf-web-proxy
  restart: unless-stopped
  ports:
    - "80:80"
    - "443:443"
  volumes:
    - ../nginx/ui.conf:/etc/nginx/conf.d/default.conf:ro
  networks:
    - app
  depends_on:
    - ui

networks:
  app:
    name: textclf_app
  observability:
    name: textclf_observability

secrets:
  textclf_tokens:
    file: ${AUTH_TOKENS_FILE}
  ui_api_token:
    file: ${API_BEARER_TOKEN_FILE}
  metrics_htpasswd:
    file: ${METRICS_HTPASSWD_FILE}