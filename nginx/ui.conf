server {
    listen 80;
    server_name hastikamali.com www.hastikamali.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name hastikamali.com www.hastikamali.com;

    ssl_certificate     /etc/letsencrypt/live/hastikamali.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hastikamali.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://textclf-ui:8501;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}