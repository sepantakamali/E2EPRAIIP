groups:
  - name: textclf_api_alerts
    rules:
      - alert: TextclfApiMetricsTargetDown
        expr: up{job="textclf-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "textclf API metrics target is down"
          description: "Prometheus cannot scrape the textclf API metrics target through metrics-proxy for more than 2 minutes. Check textclf-api, metrics-proxy, and Prometheus scrape authentication."

      - alert: TextclfPredictLatencyHigh
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(pred_latency_seconds_bucket{job="textclf-api"}[5m])) by (le)
          ) > 0.75
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "textclf prediction p95 latency is high"
          description: "p95 prediction latency has been above 750ms for 10 minutes. Check model loading, CPU/memory pressure, and request volume."

      - alert: TextclfPredictionErrorRateHigh
        expr: >-
          (
            sum(rate(pred_request_errors_total{job="textclf-api"}[5m]))
            /
            clamp_min(sum(rate(pred_requests_total{job="textclf-api"}[5m])), 0.001)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "textclf prediction error rate is high"
          description: "Prediction error rate has been above 5% for 10 minutes. Check API logs with X-Request-ID correlation and recent model/artifact changes."

      - alert: TextclfNoPredictionTraffic
        expr: sum(rate(pred_requests_total{job="textclf-api"}[15m])) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "textclf API has no prediction traffic"
          description: "No prediction requests have been observed for 30 minutes."