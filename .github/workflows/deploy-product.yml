name: textclf-product

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
            if [ -z "$COMMIT_SHA" ]; then
              COMMIT_SHA="${{ github.sha }}"
            fi

            export IMAGE_TAG="sha-${COMMIT_SHA:0:7}"
            IMAGE="ghcr.io/sepantakamali/e2epraiip:${IMAGE_TAG}"

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Deploying image: ${IMAGE}"

            docker pull "${IMAGE}"
            docker compose --env-file .env -f deploy/docker-compose.product.yml pull
            docker compose --env-file .env -f deploy/docker-compose.product.yml up -d
            docker compose --env-file .env -f deploy/docker-compose.product.yml ps

            echo "Waiting for API health check..."
            sleep 3

            for i in {1..30}; do
              if docker exec textclf-api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"; then
                echo "Deployment successful"
                docker compose --env-file .env -f deploy/docker-compose.product.yml images
                docker inspect textclf-product --format 'Image={{.Image}}'
                docker image inspect "${IMAGE}" --format 'ImageId={{.Id}}'
                exit 0
              fi

              echo "Health check failed; retrying in 2 seconds... ($i/30)"
              sleep 2
            done

            echo "Deployment failed: API did not become healthy"
            docker compose --env-file .env -f deploy/docker-compose.product.yml logs --tail=100
            exit 1