name: textclf-product

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync product files
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/textclf_deploy
          chmod 600 ~/.ssh/textclf_deploy

          ssh -i ~/.ssh/textclf_deploy \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/deploy' '$DEPLOY_PATH/nginx' '$DEPLOY_PATH/admin' '$DEPLOY_PATH/textclf'"

          rsync -avz \
            -e "ssh -i ~/.ssh/textclf_deploy -o StrictHostKeyChecking=accept-new" \
            deploy/docker-compose.product.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/docker-compose.product.yml"
          
          rsync -avz \
            -e "ssh -i ~/.ssh/textclf_deploy -o StrictHostKeyChecking=accept-new" \
            deploy/token-principals.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/token-principals.yml"

          rsync -avz \
            -e "ssh -i ~/.ssh/textclf_deploy -o StrictHostKeyChecking=accept-new" \
            admin/__init__.py \
            admin/manage_tokens.py \
            admin/token_consumer.py \
            admin/token_issuance.py \
            admin/token_rotation.py \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/admin/"

          rsync -avz \
            -e "ssh -i ~/.ssh/textclf_deploy -o StrictHostKeyChecking=accept-new" \
            src/textclf/token_store.py \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/textclf/"

          ssh -i ~/.ssh/textclf_deploy \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            ": > '$DEPLOY_PATH/textclf/__init__.py'"

          rsync -avz \
            -e "ssh -i ~/.ssh/textclf_deploy -o StrictHostKeyChecking=accept-new" \
            nginx/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/nginx/"
          
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            
            cd ${{ secrets.DEPLOY_PATH }}

            PREVIOUS_IMAGE="$(docker inspect textclf-api \
              --format '{{.Config.Image}}' 2>/dev/null || true)"

            PREVIOUS_TAG=""
            if [[ "$PREVIOUS_IMAGE" == ghcr.io/sepantakamali/e2epraiip:sha-* ]]; then
              PREVIOUS_TAG="${PREVIOUS_IMAGE##*:}"
            fi

            echo "Previous deployed image: ${PREVIOUS_IMAGE:-none}"

            echo "Validating token administration tooling..."

            python3 -c "
            from admin import token_consumer
            from admin import token_issuance
            from admin import token_rotation
            from textclf import token_store
            print('Token administration tooling imports successfully')
            "

            python3 -m admin.manage_tokens --help >/dev/null

            echo "Token administration tooling validated"

            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
            if [ -z "$COMMIT_SHA" ]; then
              COMMIT_SHA="${{ github.sha }}"
            fi

            export IMAGE_TAG="sha-${COMMIT_SHA:0:7}"
            IMAGE="ghcr.io/sepantakamali/e2epraiip:${IMAGE_TAG}"

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              printf '\nIMAGE_TAG=%s\n' "${IMAGE_TAG}" >> .env
            fi

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Deploying image: ${IMAGE}"

            docker pull "${IMAGE}"
            docker compose --env-file .env -f deploy/docker-compose.product.yml pull
            docker compose --env-file .env -f deploy/docker-compose.product.yml up -d
            docker compose --env-file .env -f deploy/docker-compose.product.yml ps

            echo "Waiting for product services to become healthy..."
            sleep 3

            for i in {1..45}; do
              API_HEALTH="$(docker inspect \
                --format '{{.State.Health.Status}}' \
                textclf-api 2>/dev/null || echo missing)"

              UI_HEALTH="$(docker inspect \
                --format '{{.State.Health.Status}}' \
                textclf-ui 2>/dev/null || echo missing)"

              echo "Health check $i/45: API=${API_HEALTH}, UI=${UI_HEALTH}"

              if [ "$API_HEALTH" = "healthy" ] && \
                [ "$UI_HEALTH" = "healthy" ]; then
                echo "Deployment successful"

                docker compose \
                  --env-file .env \
                  -f deploy/docker-compose.product.yml \
                  images

                docker inspect textclf-api \
                  --format 'ContainerImage={{.Image}}'

                docker image inspect "${IMAGE}" \
                  --format 'ImageId={{.Id}}'

                echo "Cleaning obsolete textclf images..."
                echo "Keeping current: ${IMAGE_TAG}"

                if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$IMAGE_TAG" ]; then
                  echo "Keeping rollback: ${PREVIOUS_TAG}"
                else
                  echo "No separate rollback image to retain"
                fi

                while IFS= read -r candidate; do
                  candidate_tag="${candidate##*:}"

                  if [ "$candidate_tag" = "$IMAGE_TAG" ]; then
                    continue
                  fi

                  if [ -n "$PREVIOUS_TAG" ] && [ "$candidate_tag" = "$PREVIOUS_TAG" ]; then
                    continue
                  fi

                  echo "Removing obsolete image: $candidate"
                  docker image rm "$candidate" || true
                done < <(
                  docker image ls \
                    --format '{{.Repository}}:{{.Tag}}' |
                  grep '^ghcr\.io/sepantakamali/e2epraiip:sha-' || true
                )

                docker image prune -f

                echo "Retained textclf images:"
                docker image ls \
                  ghcr.io/sepantakamali/e2epraiip \
                  --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}'

                exit 0
              fi

              echo "Health check failed; retrying in 2 seconds... ($i/45)"
              sleep 2
            done

            echo "Deployment failed: product services did not become healthy"
            docker compose --env-file .env -f deploy/docker-compose.product.yml logs --tail=100
            exit 1
