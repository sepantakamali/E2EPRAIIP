name: Deploy Monitoring

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "deploy/docker-compose.monitor.yml"
      - "monitoring/**"
      - "scripts/generate_prometheus_config.sh"
      - "grafana/**"
      - ".github/workflows/deploy-monitor.yml"

jobs:
  deploy-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync monitoring files
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/textclf_deploy
          chmod 600 ~/.ssh/textclf_deploy

          ssh -i ~/.ssh/textclf_deploy \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/deploy' '$DEPLOY_PATH/monitoring' '$DEPLOY_PATH/scripts'"

          rsync -avz \
            -e "ssh -i ~/.ssh/textclf_deploy -o StrictHostKeyChecking=accept-new" \
            deploy/docker-compose.monitor.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/docker-compose.monitor.yml"

          rsync -avz \
            -e "ssh -i ~/.ssh/textclf_deploy -o StrictHostKeyChecking=accept-new" \
            monitoring/prometheus.yml.tmpl \
            monitoring/alerts.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/monitoring/"

          rsync -avz \
            -e "ssh -i ~/.ssh/textclf_deploy -o StrictHostKeyChecking=accept-new" \
            scripts/generate_prometheus_config.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/"

      - name: Deploy monitoring stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            cd ${{ secrets.DEPLOY_PATH }}

            echo "Deploying monitoring stack..."

            bash scripts/generate_prometheus_config.sh

            docker compose --env-file .env -f deploy/docker-compose.monitor.yml pull

            docker compose --env-file .env -f deploy/docker-compose.monitor.yml run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml

            docker compose --env-file .env -f deploy/docker-compose.monitor.yml up -d --force-recreate

            docker compose --env-file .env -f deploy/docker-compose.monitor.yml ps

            echo "Waiting for Prometheus..."
            sleep 5

            for i in {1..30}; do
              PROMETHEUS_OK=0

              if curl -fsS http://127.0.0.1:9090/-/ready > /dev/null; then
                PROMETHEUS_OK=1
              fi

              if [ "$PROMETHEUS_OK" -eq 1 ]; then
                echo "Monitoring deployment successful"
                docker compose --env-file .env -f deploy/docker-compose.monitor.yml ps
                docker compose --env-file .env -f deploy/docker-compose.monitor.yml images
                exit 0
              fi

              echo "Monitoring health check failed; retrying in 2 seconds... ($i/30)"
              sleep 2
            done

            echo "Monitoring deployment failed"

            docker compose --env-file .env -f deploy/docker-compose.monitor.yml logs --tail=100

            exit 1