name: Deploy

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -p textclf pull
            docker compose -p textclf up -d

            docker compose -p textclf ps

            echo "Waiting for API health check..."
            sleep 3

            for i in {1..30}; do
              if curl -fsS http://localhost:8000/health; then
                echo "Deployment successful"
                exit 0
              fi

              echo "Health check failed; retrying in 2 seconds... ($i/30)"
              sleep 2
            done

            echo "Deployment failed: API did not become healthy"
            docker compose -p textclf logs --tail=100 api
            exit 1