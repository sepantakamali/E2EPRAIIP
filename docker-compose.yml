version: "3.9"
services:
  api:
    build: .
    image: textclf-api:latest           # build first: docker build -t textclf-api .
    ports:
      - "8000:8000"
    environment:
      MODEL_POINTER: "latest"
      LOG_LEVEL: "INFO"
      MAX_TEXTS: "64"
      MAX_TEXT_LEN: "2000"
    volumes:
      - ./artifacts:/app/artifacts      # mount your models
    restart: unless-stopped
